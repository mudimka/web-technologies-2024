<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Меню Пиццы</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <div class="container">
        <h1>Заказ Пиццы</h1>
        
        <div class="menu-section">
            <h2>Выберите пиццу</h2>
            <select id="pizzaType">
                <option value="Маргарита" selected>Маргарита</option>
                <option value="Пепперони">Пепперони</option>
                <option value="Баварская">Баварская</option>
            </select>
        </div>

        <div class="menu-section" id="sizeDiv">
            <h2>Выберите размер</h2>
            <select id="size">
                <option value="Большая" selected>Большая</option>
                <option value="Маленькая">Маленькая</option>
            </select>
        </div>

        <div class="menu-section" id="toppingsDiv">
            <h2>Добавки</h2>
            <label><input type="checkbox" value="сливочная моцарелла" id="topping1"> Сливочная моцарелла</label><br />
            <label><input type="checkbox" value="сырный борт" id="topping2"> Сырный борт</label><br />
            <label><input type="checkbox" value="чедер и пармезан" id="topping3"> Чедер и пармезан</label><br />
        </div>

        <button id="calculateBtn">Добавить в корзину за <br>
                    <span id="price">0</span> рублей (<span id="calories">0</span> Ккалорий)
        </button>
    </div>

    <script src="pizza.js"></script>
</body>
</html>
