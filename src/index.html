<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лента постов</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Все посты</h1>
        <div id="postsList" class="posts-list">Загрузка постов...</div>
    </div>

    <script>
        // Асинхронная функция для получения всех постов
        async function fetchPosts() {
            const postsContainer = document.getElementById('postsList');
            
            try {
                // Запрос на получение постов
                const response = await fetch('https://jsonplaceholder.typicode.com/posts');
                
                // Проверка, успешен ли ответ
                if (!response.ok) {
                    throw new Error(`Ошибка HTTP: ${response.status}`);
                }
                
                const posts = await response.json();
                
                // Очищаем контейнер
                postsContainer.innerHTML = '';
                
                // Отображаем каждый пост
                posts.forEach(post => {
                    const postCard = document.createElement('div');
                    postCard.className = 'post-card';
                    postCard.innerHTML = `
                        <h3>${post.title}</h3>
                        <p>${post.body.substring(0, 120)}...</p>
                        <a href="post.html?id=${post.id}" class="read-more">Читать далее →</a>
                    `;
                    postsContainer.appendChild(postCard);
                });
                
            } catch (error) {
                console.error('Ошибка при загрузке постов:', error);
                postsContainer.innerHTML = `<div class="error"> Не удалось загрузить посты: ${error.message}</div>`;
            }
        }
        
        document.addEventListener('DOMContentLoaded', fetchPosts);
    </script>
</body>
</html>
